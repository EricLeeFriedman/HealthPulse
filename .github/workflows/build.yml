name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Run tests
        run: dotnet test tests/HealthPulse.Tests/HealthPulse.Tests.csproj --logger "console;verbosity=normal"

      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "args=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore -p:AndroidSigningKeyAlias=healthpulse -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; APK is signed with a throwaway debug key and won't install over a previous build."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish HealthPulse.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormats=apk
          -p:ApplicationVersion=${{ github.run_number }}
          -p:ApplicationDisplayVersion=1.0.${{ github.run_number }}
          ${{ steps.signing.outputs.args }}
          -o out

      - name: Name APK
        run: |
          apk=$(ls out/*-Signed.apk | head -1)
          cp "$apk" "HealthPulse-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HealthPulse-apk
          path: HealthPulse-*.apk
          retention-days: 30

      - name: Publish release (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v1.0.${{ github.run_number }}" HealthPulse-*.apk
          --title "HealthPulse 1.0.${{ github.run_number }}"
          --notes "Built from ${{ github.sha }}. On your phone, open the APK to install or update."
          --latest
